# Membuat APK HP Ceria secara otomatis di server GitHub (tanpa laptop).
# Hasil: tab "Releases" di repository → unduh file .apk langsung dari HP.
name: Build APK HP Ceria

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Cari folder proyek (langsung, atau dari hp_ceria.zip)
        run: | if [ -f pubspec.yaml ]; then echo "APP_DIR=." >> "$GITHUB_ENV" elif [ -f hp_ceria.zip ]; then unzip -q -o hp_ceria.zip echo "APP_DIR=hp_ceria" >> "$GITHUB_ENV" else echo "::error::Tidak ditemukan pubspec.yaml maupun hp_ceria.zip di repository" exit 1 fi 
      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: | flutter pub get flutter build apk --release cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/hp-ceria.apk 
      - name: Terbitkan APK di tab Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HP Ceria build ${{ github.run_number }}
          body: Unduh file hp-ceria.apk di bawah ini dari HP Android, lalu buka untuk memasang.
          files: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/hp-ceria.apk
          fail_on_unmatched_files: true
